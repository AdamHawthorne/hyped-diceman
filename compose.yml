services:
  diceman:
    image: hyped-diceman:latest
    container_name: hyped-diceman
    restart: unless-stopped
    working_dir: /app
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      TZ: Europe/London
    volumes:
      - ./bot.db:/app/bot.db
      - ./bot.db-wal:/app/bot.db-wal
      - ./bot.db-shm:/app/bot.db-shm
      - ./.env:/app/.env:ro
      - ./assets:/app/assets:ro
      - ./logs:/app/logs