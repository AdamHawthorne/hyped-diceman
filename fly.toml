app = "hyped-diceman"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  BOT_NAME = "Hyped Ogre"
  BOT_TIMEZONE = "Europe/London"
  DB_PATH = "/data/bot.db"
  ADMIN_MODE = "true"
  ENABLE_COMMAND_LOGGING = "true"
  ENABLE_WEBHOOK = "false"
  FOREVER_ROLE_ID = "1563364290658967593"
  FLAMEBOARD_CHANNEL_ID = "1562128686931644436"
  FLAMEBOARD_THRESHOLD = "4"

[[mounts]]
  source = "diceman_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
